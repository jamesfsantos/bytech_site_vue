<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#063b4b"></stop>
      <stop offset="1" stop-color="#1a9ed8"></stop>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#0b6b8c"></stop>
      <stop offset="1" stop-color="#4dd1ff"></stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5fc6ff"></stop>
      <stop offset="1" stop-color="#2aa7e6"></stop>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.15"></feDropShadow>
    </filter>
  </defs>

  <g transform="translate(300,110)">

    <g transform="rotate(-45 120 120)">
      <rect x="60" y="60" width="180" height="180" rx="28" ry="28" fill="url(#g1)" filter="url(#softShadow)"></rect>
      <text x="150" y="125" text-anchor="middle" font-family="Segoe UI, Arial" font-size="36" fill="#ffffff" font-weight="700">1</text>
      <text x="120" y="160" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" fill="#e6f8ff">1</text>
      <text x="180" y="160" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" fill="#e6f8ff">1</text>
    </g>

    <g transform="translate(120,0) rotate(-45 120 120)">
      <rect x="60" y="60" width="180" height="180" rx="22" ry="22" fill="url(#g2)" opacity="0.95"></rect>
      <text x="150" y="125" text-anchor="middle" font-family="Segoe UI, Arial" font-size="36" fill="#ffffff" font-weight="700">1</text>
      <text x="120" y="160" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" fill="#dff8ff">0</text>
      <text x="180" y="160" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" fill="#dff8ff">0</text>
    </g>

    <g transform="translate(240,0) rotate(-45 120 120)">
      <rect x="60" y="60" width="180" height="180" rx="18" ry="18" fill="#9be6ff" opacity="0.95"></rect>
      <text x="150" y="125" text-anchor="middle" font-family="Segoe UI, Arial" font-size="36" fill="#ffffff" font-weight="700">1</text>
      <text x="120" y="160" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" fill="#ffffff">0</text>
      <text x="180" y="160" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" fill="#ffffff">1</text>
    </g>

  </g>

  <g transform="translate(0,360)">
    <text x="600" y="120" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="120" font-weight="800" fill="url(#textGrad)" letter-spacing="6">BYTECH</text>
    <text x="600" y="200" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="36" fill="#6fbfe8" letter-spacing="8">GAMES</text>
  </g>

</svg>